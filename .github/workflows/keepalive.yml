name: keep-alive

# Pings the backend so the free Render instance never spins down (no ~50s cold start).
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:            # allow manual "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
              https://cyberuzcheck-backend.onrender.com/health) && [ "$code" = "200" ] && exit 0
            echo "attempt $i -> $code; retrying"
            sleep 20
          done
          echo "health check failed"; exit 1
