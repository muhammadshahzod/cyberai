<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>CyberCheck</title>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> CyberCheck</div>
    <button id="settings-toggle" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <section id="settings" hidden>
    <label for="backend-url">Backend URL</label>
    <input id="backend-url" type="url" placeholder="https://…onrender.com" spellcheck="false" />
    <label for="api-key">API key <span class="muted">(optional)</span></label>
    <input id="api-key" type="password" placeholder="only if the backend requires one" />
    <button id="save-settings" class="ghost">Save settings</button>
    <p id="backend-status" class="muted"></p>
  </section>

  <main>
    <input id="value" type="text" placeholder="paste an email, link, or password" autocomplete="off" />

    <div class="row">
      <select id="type" aria-label="Check as">
        <option value="auto">Auto-detect</option>
        <option value="email">Email</option>
        <option value="url">Link / URL</option>
        <option value="password">Password</option>
      </select>
      <button id="use-tab" class="ghost" type="button">This tab</button>
    </div>

    <button id="check" class="primary" type="button">Check</button>

    <p id="status" class="status" hidden></p>

    <div id="result" hidden>
      <div class="badge-row">
        <span id="badge" class="badge">—</span>
        <span id="engine" class="engine muted"></span>
      </div>
      <p id="summary"></p>
      <ul id="signals"></ul>
      <details id="details-wrap">
        <summary>Raw details</summary>
        <pre id="details"></pre>
      </details>
    </div>

    <p id="error" class="error" hidden></p>

    <section id="history-wrap" hidden>
      <div class="history-head">Recent checks <button id="clear-history" class="link">clear</button></div>
      <ul id="history"></ul>
    </section>
  </main>

  <footer>Nothing you type is stored by this extension. Passwords never leave your device un-hashed.</footer>

  <script src="popup.js"></script>
</body>
</html>
